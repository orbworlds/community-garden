<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Garden</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3d9b8; font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  .glass { background: rgba(255,255,255,.34); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,.55); color: #2f3a26; box-shadow: 0 6px 24px rgba(80,60,30,.12); }
  #count { position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; white-space: nowrap; }
  #water { position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); padding: 8px 14px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  #water:active { transform: scale(.96); }
  #seeds { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 8px 10px; border-radius: 22px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #seeds .row { display: flex; gap: 4px; align-items: center; }
  #seeds .kind { width: 44px; height: 44px; border-radius: 14px; border: 0; background: transparent; font-size: 24px; cursor: pointer; transition: transform .15s, background .2s; }
  #seeds .kind.on { background: rgba(255,255,255,.75); transform: scale(1.06); box-shadow: 0 2px 10px rgba(80,60,30,.15); }
  #seeds .dot { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); cursor: pointer; padding: 0; transition: transform .15s; }
  #seeds .dot.on { transform: scale(1.18); box-shadow: 0 0 0 2px #2f3a26; }
  #seeds .left { font-size: 12.5px; font-weight: 600; opacity: .8; }
  #hint { position: fixed; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 128px); left: 50%; transform: translateX(-50%); padding: 7px 13px; border-radius: 999px; font-size: 13px; font-weight: 600; transition: opacity 1s; white-space: nowrap; pointer-events: none; }
  #card { position: fixed; top: calc(max(14px, env(safe-area-inset-top)) + 52px); left: 50%; transform: translateX(-50%) translateY(-6px); padding: 10px 16px; border-radius: 16px; font-size: 14px; font-weight: 600; text-align: center; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; white-space: nowrap; }
  #card.on { opacity: 1; transform: translateX(-50%); }
  @media (max-width: 560px) {
    #seeds { left: max(12px, env(safe-area-inset-left)); transform: none; }
    #hint { left: max(12px, env(safe-area-inset-left)); transform: none; white-space: normal; max-width: calc(100vw - 130px); }
    #seeds .kind { width: 40px; height: 40px; font-size: 22px; }
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head>
<body>
<div id="count" class="glass">🌼 The garden is waking up…</div>
<button id="water" class="glass" type="button">💧 Water</button>
<div id="hint" class="glass">Pick a seed, then tap the soil to plant · drag to look around</div>
<div id="card" class="glass" role="status"></div>
<div id="seeds" class="glass">
  <div class="row" id="kinds"></div>
  <div class="row" id="colors"></div>
  <div class="left" id="left"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// === CONFIG ===
const CONFIG = {
  sky: { top: '#7fb3e8', horizon: '#ffd9b0' },
  grass: '#86b45c', soil: '#7a5638', stone: '#cfc6b8',
  bedRadius: 10.5,
  plantScale: 1.75,           // how big the flowers are
  seedsPerDay: 3,
  maxPlants: 200,              // the shared list keeps the newest 200 plants
  growSeconds: 25,             // a fresh seed grows into a flower right before your eyes
  grassBlades: 2600, bees: 6, butterflies: 5,
};
const KEY = 'garden', WATER = 'garden-water';
const KINDS = {
  tulip: { emoji: '🌷', name: 'tulip', height: 1.15, colors: ['#ff5d8f', '#ff9f43', '#ffd166', '#c77dff', '#ffffff'] },
  daisy: { emoji: '🌼', name: 'daisy', height: 0.85, colors: ['#ffffff', '#ffc8dd', '#cdb4ff', '#fff1a8', '#a0e7ff'] },
  sunflower: { emoji: '🌻', name: 'sunflower', height: 2.2, colors: ['#ffc928', '#ffb000', '#ff8c1a', '#fff06a', '#e85d2c'] },
  lavender: { emoji: '💜', name: 'lavender', height: 1.05, colors: ['#a78bfa', '#c084fc', '#818cf8', '#f0abfc', '#93c5fd'] },
  rose: { emoji: '🌹', name: 'rose', height: 1.0, colors: ['#e63950', '#ff8fab', '#fff0f3', '#ffb703', '#9d4edd'] },
};
const KIND_IDS = Object.keys(KINDS);

const orb = window.orb;
const me = orb?.me ?? { id: 'me', name: 'You', color: '#86b45c' };
const isTouch = matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches;

// Shared state: orb.store inside Orb, this browser's storage when the file runs on its own.
const store = orb?.store ?? {
  async get(k) { try { return JSON.parse(localStorage.getItem('store:' + k)); } catch { return null; } },
  async push(k, item, max = 50) { const l = ((await this.get(k)) || []).concat([item]).slice(-max); localStorage.setItem('store:' + k, JSON.stringify(l)); return l; },
  async incr(k, by = 1) { const v = (Number(await this.get(k)) || 0) + by; localStorage.setItem('store:' + k, JSON.stringify(v)); return v; },
};
const BLOCK = /\b(fuck\w*|shit\w*|bitch\w*|cunt\w*|dick\w*|cock\w*|asshole\w*|whore\w*|slut\w*|nigg\w*|fag\w*|retard\w*|porn\w*|nazi\w*)\b/gi;
const cleanName = (s) => String(s || '').replace(/\s+/g, ' ').trim().slice(0, 30).replace(BLOCK, '✨') || 'A gardener';

// === SCENE ===
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(CONFIG.sky.horizon, 60, 150);
const camera = new THREE.PerspectiveCamera(Math.min(innerWidth, innerHeight) < 600 ? 60 : 48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 11, 20);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 9; controls.maxDistance = 36;
controls.minPolarAngle = 0.45; controls.maxPolarAngle = 1.28;
controls.autoRotateSpeed = 0.35;

// === SKY & LIGHT ===
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(300, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { top: { value: new THREE.Color(CONFIG.sky.top) }, horizon: { value: new THREE.Color(CONFIG.sky.horizon) } },
    vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
    fragmentShader: `uniform vec3 top, horizon; varying vec3 vP;
      void main(){ float h = max(vP.y, 0.); vec3 c = mix(horizon, top, pow(smoothstep(0., .55, h), .8));
        c += vec3(1., .75, .45) * .35 * pow(max(dot(vP, normalize(vec3(-.6, .25, -.75))), 0.), 12.); gl_FragColor = vec4(c, 1.); }`,
  }),
));
scene.add(new THREE.HemisphereLight('#cfe6ff', '#8a6a44', 1.25));
const sun = new THREE.DirectionalLight('#fff0d6', 2.4);
sun.position.set(-18, 26, -14); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 4; sun.shadow.blurSamples = 12;
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 80 });
scene.add(sun);

// Clouds drifting by.
const clouds = new THREE.Group();
{
  const mat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, flatShading: true, transparent: true, opacity: 0.92 });
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Group();
    for (let j = 0; j < 4; j++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(2 + Math.random() * 2, 0), mat); s.position.set(j * 2.4 - 3.6, Math.random() * 0.8, Math.random()); c.add(s); }
    c.position.set(-80 + i * 26, 26 + Math.random() * 10, -50 - Math.random() * 40); c.scale.setScalar(1.2 + Math.random()); clouds.add(c);
  }
  scene.add(clouds);
}

// === WORLD ===
const ground = new THREE.Mesh(new THREE.CircleGeometry(160, 64), new THREE.MeshStandardMaterial({ color: CONFIG.grass, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// The garden bed: soft soil with a wobbly edge, ringed by stones.
const bed = (() => {
  const shape = new THREE.Shape();
  for (let i = 0; i <= 64; i++) {
    const a = (i / 64) * Math.PI * 2, r = CONFIG.bedRadius + Math.sin(a * 5) * 0.35 + Math.sin(a * 3 + 1) * 0.25;
    i ? shape.lineTo(Math.cos(a) * r, Math.sin(a) * r) : shape.moveTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const m = new THREE.Mesh(new THREE.ShapeGeometry(shape, 32), new THREE.MeshStandardMaterial({ color: CONFIG.soil, roughness: 1 }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.03; m.receiveShadow = true; scene.add(m);
  const stones = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.42, 0), new THREE.MeshStandardMaterial({ color: CONFIG.stone, roughness: 0.9, flatShading: true }), 70);
  const mt = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  for (let i = 0; i < 70; i++) {
    const a = (i / 70) * Math.PI * 2, r = CONFIG.bedRadius + 0.55 + Math.sin(a * 5) * 0.35 + Math.sin(a * 3 + 1) * 0.25;
    q.setFromEuler(new THREE.Euler(Math.random(), Math.random() * 3, Math.random()));
    mt.compose(new THREE.Vector3(Math.cos(a) * r, 0.12, -Math.sin(a) * r), q, s.set(1 + Math.random() * 0.4, 0.6 + Math.random() * 0.3, 1 + Math.random() * 0.4));
    stones.setMatrixAt(i, mt);
  }
  stones.castShadow = true; stones.receiveShadow = true; scene.add(stones);
  return m;
})();

// A little birdbath in the middle, where the bees like to rest.
const bath = (() => {
  const g = new THREE.Group();
  const stone = new THREE.MeshStandardMaterial({ color: '#d9d1c4', roughness: 0.85 });
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 1.2, 12), stone); base.position.y = 0.6;
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.55, 0.35, 20), stone); bowl.position.y = 1.35;
  const water = new THREE.Mesh(new THREE.CircleGeometry(0.95, 24), new THREE.MeshStandardMaterial({ color: '#7cc6f0', roughness: 0.1, metalness: 0.2 }));
  water.rotation.x = -Math.PI / 2; water.position.y = 1.53;
  for (const m of [base, bowl]) { m.castShadow = true; m.receiveShadow = true; }
  g.add(base, bowl, water); scene.add(g); return g;
})();

// Trees, bushes and a fence around the meadow.
{
  const leaf = new THREE.MeshStandardMaterial({ color: '#5f9a4a', roughness: 0.9, flatShading: true });
  const trunk = new THREE.MeshStandardMaterial({ color: '#7a5235', roughness: 1 });
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + Math.random() * 0.3, r = 24 + Math.random() * 14;
    const t = new THREE.Group();
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 2.4, 7), trunk); tr.position.y = 1.2;
    const k = 1 + Math.random() * 0.9;
    const top = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9, 0), leaf.clone()); top.material.color.offsetHSL((Math.random() - 0.5) * 0.06, 0, (Math.random() - 0.5) * 0.08); top.position.y = 3.4;
    for (const m of [tr, top]) m.castShadow = true;
    t.add(tr, top); t.scale.setScalar(k); t.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); scene.add(t);
  }
  const wood = new THREE.MeshStandardMaterial({ color: '#c49a6c', roughness: 0.9 });
  for (let i = 0; i < 28; i++) {
    const a = -0.4 + (i / 27) * (Math.PI + 0.8), r = 19;
    if (Math.abs(a - Math.PI / 2) < 0.18) continue; // gap for the path
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.25, 1.2, 0.25), wood); post.position.set(Math.cos(a) * r, 0.6, -Math.sin(a) * r); post.castShadow = true; scene.add(post);
    if (i < 27 && Math.abs(a + (Math.PI + 0.8) / 27 - Math.PI / 2) >= 0.18) {
      const a2 = a + (Math.PI + 0.8) / 27, mid = (a + a2) / 2, len = 2 * r * Math.sin((a2 - a) / 2);
      for (const y of [0.45, 0.95]) { const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.12, 0.08), wood); rail.position.set(Math.cos(mid) * r, y, -Math.sin(mid) * r); rail.rotation.y = mid + Math.PI / 2; scene.add(rail); }
    }
  }
  // Stepping-stone path from where you stand to the bed.
  const step = new THREE.MeshStandardMaterial({ color: '#e0d6c6', roughness: 0.95 });
  for (let i = 0; i < 7; i++) { const s = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.8, 0.1, 9), step); s.position.set(Math.sin(i) * 0.5, 0.05, CONFIG.bedRadius + 1.6 + i * 1.6); s.receiveShadow = true; scene.add(s); }
}

// Grass blades swaying in the breeze (one instanced mesh, swayed in the vertex shader).
const grassUniforms = { time: { value: 0 } };
{
  const blade = new THREE.ConeGeometry(0.06, 0.42, 4, 1); blade.translate(0, 0.21, 0);
  const mat = new THREE.MeshStandardMaterial({ color: '#8fc35e', emissive: '#2f4f19', roughness: 1 });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.time = grassUniforms.time;
    sh.vertexShader = 'uniform float time;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wp = instanceMatrix * vec4(0.,0.,0.,1.);
      transformed.x += sin(time * 1.8 + wp.x * .35 + wp.z * .25) * .12 * position.y * 2.;`);
  };
  const grass = new THREE.InstancedMesh(blade, mat, CONFIG.grassBlades);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < CONFIG.grassBlades; i++) {
    let x, z; do { x = (Math.random() - 0.5) * 70; z = (Math.random() - 0.5) * 70; } while (Math.hypot(x, z) < CONFIG.bedRadius + 1.4 || (Math.abs(x) < 1.3 && z > CONFIG.bedRadius && z < 26));
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * 3);
    m.compose(new THREE.Vector3(x, 0, z), q, s.set(1, 0.5 + Math.random() * 0.8, 1)); grass.setMatrixAt(i, m);
    grass.setColorAt(i, c.set('#8fc35e').offsetHSL((Math.random() - 0.5) * 0.05, 0, (Math.random() - 0.5) * 0.12));
  }
  scene.add(grass);
}

// === FLOWERS ===
// Every plant is drawn with a few instanced meshes (stems, leaves, one bloom mesh per kind, flower
// centers), so even 200 flowers cost a handful of draw calls.
const MAX = CONFIG.maxPlants + 40;
function petalRing(n, len, wid, lift, tilt) {
  const parts = [];
  for (let i = 0; i < n; i++) {
    const p = new THREE.SphereGeometry(1, 8, 5); p.scale(len, 0.05, wid); p.translate(len * 0.9, lift, 0);
    p.rotateZ(tilt); p.rotateY((i / n) * Math.PI * 2); parts.push(p);
  }
  return mergeGeometries(parts);
}
function cup(r, h, layers = 1) {
  const parts = [];
  for (let k = 0; k < layers; k++) {
    const rr = r * (1 - k * 0.28), pts = [];
    for (let i = 0; i <= 8; i++) { const t = i / 8; pts.push(new THREE.Vector2(rr * Math.sin(t * Math.PI * 0.62) * (1 + 0.1 * Math.sin(t * 9)), t * h * (1 - k * 0.15))); }
    const g = new THREE.LatheGeometry(pts, 12); g.rotateY(k * 0.6); parts.push(g);
  }
  return mergeGeometries(parts);
}
const BLOOM_GEO = {
  tulip: cup(0.24, 0.42),
  daisy: petalRing(12, 0.2, 0.06, 0, 0.12),
  sunflower: petalRing(16, 0.36, 0.1, 0, 0.18),
  lavender: (() => { const parts = []; for (let i = 0; i < 9; i++) { const s = new THREE.SphereGeometry(0.075 - i * 0.004, 7, 5); s.translate(Math.sin(i * 2.4) * 0.05, i * 0.07, Math.cos(i * 2.4) * 0.05); parts.push(s); } return mergeGeometries(parts); })(),
  rose: cup(0.22, 0.3, 3),
};
const CENTER_GEO = new THREE.CylinderGeometry(1, 1, 0.08, 14);
const blooms = {};
for (const k of KIND_IDS) {
  const m = new THREE.InstancedMesh(BLOOM_GEO[k], new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.6, side: THREE.DoubleSide }), MAX);
  m.count = 0; m.castShadow = true; m.frustumCulled = false; scene.add(m); blooms[k] = m;
}
const stemGeo = new THREE.CylinderGeometry(0.03, 0.04, 1, 5); stemGeo.translate(0, 0.5, 0);
const stems = new THREE.InstancedMesh(stemGeo, new THREE.MeshStandardMaterial({ color: '#4f8a3a', roughness: 0.9 }), MAX);
const leafGeo = (() => { const a = new THREE.SphereGeometry(1, 8, 5); a.scale(0.22, 0.03, 0.08); a.translate(0.2, 0, 0); a.rotateZ(0.5); const b = a.clone(); b.rotateY(Math.PI); return mergeGeometries([a, b]); })();
const leaves = new THREE.InstancedMesh(leafGeo, new THREE.MeshStandardMaterial({ color: '#5c9b45', roughness: 0.9 }), MAX);
const centers = new THREE.InstancedMesh(CENTER_GEO, new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.8 }), MAX);
for (const m of [stems, leaves, centers]) { m.count = 0; m.castShadow = true; m.frustumCulled = false; scene.add(m); }

const plants = [];
const known = new Set();
function hash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function addPlant(item, { fresh = false } = {}) {
  if (!item || typeof item.id !== 'string' || known.has(item.id) || !KINDS[item.k]) return null;
  const x = Number(item.x), z = Number(item.z);
  if (!Number.isFinite(x) || !Number.isFinite(z) || Math.hypot(x, z) > CONFIG.bedRadius) return null;
  known.add(item.id);
  const kind = KINDS[item.k];
  const p = {
    id: item.id, k: item.k, x, z, n: cleanName(item.n), t: Number(item.t) || Date.now(), mine: item.by === me.id, orbSeed: !!item.orbSeed,
    color: new THREE.Color(kind.colors.includes(item.c) ? item.c : kind.colors[0]),
    phase: hash(item.id) * 10, size: 0.9 + hash(item.id + 's') * 0.25, born: fresh ? performance.now() / 1000 : -1e9, top: new THREE.Vector3(),
  };
  plants.push(p);
  if (plants.length > MAX) { const old = plants.shift(); known.delete(old.id); }
  updateCount();
  return p;
}

// A bare garden is no fun: Orb plants a few flowers until the first gardeners arrive.
const STARTERS = 16;
function seedStarters(n) {
  for (let i = 0; i < n; i++) {
    const a = i * 2.399, r = 2.2 + Math.sqrt(i / STARTERS) * (CONFIG.bedRadius - 3.5);
    const k = KIND_IDS[i % KIND_IDS.length];
    addPlant({ id: 'orb-' + i, k, c: KINDS[k].colors[i % 3], x: Math.cos(a) * r, z: Math.sin(a) * r, n: 'Orb', t: Date.now() - (i + 2) * 86400e3, orbSeed: true });
  }
}

// Orb's starter flowers make way for real ones (one each).
function makeWay() {
  const starter = plants.find((p) => p.orbSeed);
  if (starter) { plants.splice(plants.indexOf(starter), 1); known.delete(starter.id); updateCount(); }
}

let gardeners = 1, waterCount = 0;
function updateCount() {
  const n = plants.length;
  const who = gardeners > 1 ? ` · ${gardeners} gardeners here` : '';
  document.getElementById('count').textContent = `🌼 ${n} ${n === 1 ? 'flower' : 'flowers'}${who}`;
}

const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), s4 = new THREE.Vector3(), e4 = new THREE.Euler(), up = new THREE.Vector3(0, 1, 0), p4 = new THREE.Vector3();
let bounce = 0; // after watering, everything does a happy little bounce
function layoutPlants(time) {
  const counts = Object.fromEntries(KIND_IDS.map((k) => [k, 0]));
  let nc = 0;
  const now = Date.now();
  plants.forEach((p, i) => {
    const kind = KINDS[p.k];
    // Grows while you're away: a little taller each day for a week.
    const days = Math.min(7, Math.max(0, (now - p.t) / 86400e3));
    const age = time - p.born;
    const grow = age < CONFIG.growSeconds ? THREE.MathUtils.smoothstep(age / CONFIG.growSeconds, 0, 1) : 1;
    const bloomK = THREE.MathUtils.smoothstep(grow, 0.45, 1);
    const h = kind.height * p.size * CONFIG.plantScale * (1 + days * 0.05) * (0.15 + 0.85 * grow);
    const sway = Math.sin(time * 1.6 + p.phase) * 0.07 + Math.sin(time * 6 + p.phase) * bounce * 0.12;
    e4.set(Math.sin(time * 1.1 + p.phase * 2) * 0.05, 0, sway);
    q4.setFromEuler(e4);
    const w = CONFIG.plantScale;
    m4.compose(p4.set(p.x, 0, p.z), q4, s4.set(w, h, w)); stems.setMatrixAt(i, m4);
    m4.compose(p4.set(p.x, 0.05 + h * 0.25, p.z), q4, s4.setScalar((0.4 + grow * 0.8) * w)); leaves.setMatrixAt(i, m4);
    p.top.set(0, h, 0).applyQuaternion(q4).add(p4.set(p.x, 0, p.z));
    const b = blooms[p.k], j = counts[p.k]++;
    const bs = (p.k === 'sunflower' ? 1.25 : 1) * p.size * CONFIG.plantScale * (0.05 + 0.95 * bloomK);
    const tilt = p.k === 'sunflower' ? new THREE.Quaternion().setFromEuler(new THREE.Euler(0.7, 0, 0)) : null;
    m4.compose(p.top, tilt ? tilt.premultiply(q4) : q4, s4.setScalar(bs)); b.setMatrixAt(j, m4); b.setColorAt(j, p.color);
    if (p.k === 'daisy' || p.k === 'sunflower') {
      const r = (p.k === 'sunflower' ? 0.22 : 0.07) * p.size * CONFIG.plantScale * bloomK;
      m4.compose(p.top, tilt ? tilt : q4, s4.set(r, 1, r)); centers.setMatrixAt(nc, m4);
      centers.setColorAt(nc, p.k === 'sunflower' ? CENTER_SUN : CENTER_DAISY); nc++;
    }
  });
  stems.count = leaves.count = plants.length; centers.count = nc;
  for (const m of [stems, leaves, centers]) { m.instanceMatrix.needsUpdate = true; if (m.instanceColor) m.instanceColor.needsUpdate = true; }
  for (const k of KIND_IDS) { const b = blooms[k]; b.count = counts[k]; b.instanceMatrix.needsUpdate = true; if (b.instanceColor) b.instanceColor.needsUpdate = true; }
}
const CENTER_SUN = new THREE.Color('#5a3a1e'), CENTER_DAISY = new THREE.Color('#ffc928');

// Bees and butterflies flutter between the flowers.
const critters = [];
{
  const beeBody = new THREE.SphereGeometry(0.12, 8, 6); beeBody.scale(1.3, 1, 1);
  const beeMat = new THREE.MeshStandardMaterial({ color: '#ffcb2e', roughness: 0.6 });
  const wingMat = new THREE.MeshStandardMaterial({ color: '#ffffff', transparent: true, opacity: 0.7, side: THREE.DoubleSide });
  for (let i = 0; i < CONFIG.bees + CONFIG.butterflies; i++) {
    const bee = i < CONFIG.bees;
    const g = new THREE.Group();
    const wingGeo = bee ? new THREE.CircleGeometry(0.1, 8) : new THREE.CircleGeometry(0.22, 10);
    const wm = bee ? wingMat : new THREE.MeshStandardMaterial({ color: ['#ff9ecb', '#9bd4ff', '#ffd36e', '#c7a2ff', '#ff9f6b'][i % 5], side: THREE.DoubleSide, roughness: 0.7 });
    const l = new THREE.Mesh(wingGeo, wm), r = new THREE.Mesh(wingGeo, wm);
    l.position.x = -0.1; r.position.x = 0.1;
    if (bee) g.add(new THREE.Mesh(beeBody, beeMat));
    else g.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.025, 0.18, 2, 6), new THREE.MeshStandardMaterial({ color: '#3a2c22' })));
    g.add(l, r); scene.add(g);
    critters.push({ g, l, r, bee, phase: Math.random() * 10, target: new THREE.Vector3(), pos: new THREE.Vector3((Math.random() - 0.5) * 20, 2, (Math.random() - 0.5) * 20), next: 0 });
  }
}
function moveCritters(time, dt) {
  for (const c of critters) {
    if (time > c.next) {
      const p = plants.length ? plants[Math.floor(Math.random() * plants.length)] : null;
      if (p) c.target.copy(p.top).add(new THREE.Vector3(0, 0.25, 0)); else c.target.set((Math.random() - 0.5) * 20, 1.5, (Math.random() - 0.5) * 20);
      c.next = time + 2.5 + Math.random() * 4;
    }
    const before = c.pos.clone();
    c.pos.lerp(c.target, Math.min(1, dt * (c.bee ? 1.1 : 0.6)));
    c.pos.y += Math.sin(time * (c.bee ? 9 : 3) + c.phase) * (c.bee ? 0.01 : 0.02);
    c.g.position.copy(c.pos);
    const v = c.pos.clone().sub(before); if (v.lengthSq() > 1e-6) c.g.rotation.y = Math.atan2(v.x, v.z);
    const flap = Math.sin(time * (c.bee ? 60 : 12) + c.phase) * (c.bee ? 0.8 : 1.1);
    c.l.rotation.set(Math.PI / 2, flap, 0); c.r.rotation.set(Math.PI / 2, -flap, 0);
  }
}

// Watering: a little cloud drifts over and it rains on the flowers.
const rain = (() => {
  const n = 500, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) pos.set([(Math.random() - 0.5) * 2 * CONFIG.bedRadius, Math.random() * 9, (Math.random() - 0.5) * 2 * CONFIG.bedRadius], i * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: '#8fd3ff', size: 0.12, transparent: true, opacity: 0, depthWrite: false }));
  scene.add(p); return p;
})();
const rainCloud = clouds.children[0].clone(); rainCloud.scale.setScalar(1.6); rainCloud.visible = false; scene.add(rainCloud);
let raining = 0;
function startRain() { raining = 5; rainCloud.visible = true; bounce = 1; }

// === PLAYER / CONTROLS ===
// Tap the soil to plant (a tap, not a drag); tap a flower to see who planted it.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; idleSince = performance.now(); controls.autoRotate = false; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 8) return;
  if (pickFlower(e.clientX, e.clientY)) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(ground)[0];
  if (hit) tryPlant(hit.point.x, hit.point.z);
});
let idleSince = performance.now();

const card = document.getElementById('card'); let cardTimer = 0;
function showCard(text) { card.textContent = text; card.classList.add('on'); clearTimeout(cardTimer); cardTimer = setTimeout(() => card.classList.remove('on'), 3800); }
const v3 = new THREE.Vector3();
function pickFlower(x, y) {
  let best = null, bestD = isTouch ? 30 : 22;
  for (const p of plants) {
    v3.copy(p.top).project(camera); if (v3.z > 1) continue;
    const d = Math.hypot((v3.x * 0.5 + 0.5) * innerWidth - x, (-v3.y * 0.5 + 0.5) * innerHeight - y);
    if (d < bestD) { bestD = d; best = p; }
  }
  if (!best) return false;
  const k = KINDS[best.k];
  showCard(`${k.emoji} ${best.mine ? 'You planted this' : `Planted by ${best.n}`} · ${ago(best.t)}`);
  pop(520 + Math.random() * 120);
  return true;
}
function ago(t) { const s = (Date.now() - t) / 1000; if (s < 60) return 'just now'; if (s < 3600) return `${Math.floor(s / 60)} min ago`; if (s < 86400) return `${Math.floor(s / 3600)} h ago`; const d = Math.floor(s / 86400); return d === 1 ? 'yesterday' : `${d} days ago`; }

// === UI ===
let kind = 'tulip', color = KINDS.tulip.colors[0];
const kindsEl = document.getElementById('kinds'), colorsEl = document.getElementById('colors'), leftEl = document.getElementById('left');
for (const k of KIND_IDS) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'kind'; b.textContent = KINDS[k].emoji; b.title = KINDS[k].name; b.setAttribute('aria-label', KINDS[k].name);
  b.onclick = () => { kind = k; color = KINDS[k].colors[0]; renderPicker(); pop(700); };
  kindsEl.appendChild(b);
}
function renderPicker() {
  [...kindsEl.children].forEach((b, i) => b.classList.toggle('on', KIND_IDS[i] === kind));
  colorsEl.innerHTML = '';
  for (const c of KINDS[kind].colors) {
    const d = document.createElement('button'); d.type = 'button'; d.className = 'dot' + (c === color ? ' on' : ''); d.style.background = c; d.setAttribute('aria-label', 'color ' + c);
    d.onclick = () => { color = c; renderPicker(); };
    colorsEl.appendChild(d);
  }
  const left = seedsLeft();
  leftEl.textContent = left > 0 ? `${left} ${left === 1 ? 'seed' : 'seeds'} left today · tap the soil to plant` : 'All planted today — come back tomorrow for more seeds 🌱';
}
const today = () => new Date().toISOString().slice(0, 10);
function seedsLeft() { try { const s = JSON.parse(localStorage.getItem('garden:seeds') || '{}'); return s.day === today() ? Math.max(0, CONFIG.seedsPerDay - s.used) : CONFIG.seedsPerDay; } catch { return CONFIG.seedsPerDay; } }
function useSeed() { const used = CONFIG.seedsPerDay - seedsLeft() + 1; try { localStorage.setItem('garden:seeds', JSON.stringify({ day: today(), used })); } catch {} }

async function tryPlant(x, z) {
  if (Math.hypot(x, z) > CONFIG.bedRadius - 0.4) return showCard('Plant inside the soil patch 🌱');
  if (Math.hypot(x, z) < 1.6) return showCard('That’s the birdbath — try next to it');
  if (seedsLeft() <= 0) return showCard('No seeds left today — come back tomorrow 🌱');
  if (plants.some((p) => Math.hypot(p.x - x, p.z - z) < 0.8)) return showCard('Too close to another flower — try a little further away');
  const item = { id: Math.random().toString(36).slice(2, 10) + Date.now().toString(36), k: kind, c: color, x: +x.toFixed(2), z: +z.toFixed(2), n: me.name, by: me.id, t: Date.now() };
  useSeed(); renderPicker();
  addPlant(item, { fresh: true });
  makeWay();
  [523, 659, 784].forEach((f, i) => pop(f, i * 0.09));
  room?.send({ plant: item });
  try { await store.push(KEY, item, CONFIG.maxPlants); } catch { orb?.toast?.('Planted here — it will be shared once you’re back online'); }
  orb?.toast?.(`You planted a ${KINDS[kind].name} 🌱 Watch it grow!`);
}

const waterBtn = document.getElementById('water'); let lastWater = 0;
function showWater() { waterBtn.textContent = waterCount ? `💧 Water · ${waterCount}` : '💧 Water'; }
waterBtn.onclick = async () => {
  if (performance.now() - lastWater < 6000) return;
  lastWater = performance.now();
  startRain(); room?.send({ water: true });
  [880, 988, 1175].forEach((f, i) => pop(f, i * 0.07, 0.03));
  try { waterCount = Number(await store.incr(WATER, 1)) || waterCount + 1; } catch { waterCount++; }
  showWater();
};

const hint = document.getElementById('hint');
if (isTouch) hint.textContent = 'Pick a seed, tap the soil to plant · drag to look';
setTimeout(() => (hint.style.opacity = 0), 7000);

// Little sounds (only after the first tap, as browsers require).
let audio = null;
function pop(freq, delay = 0, vol = 0.05) {
  try { audio ??= new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  const t = audio.currentTime + delay, o = audio.createOscillator(), g = audio.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 1.5, t + 0.12);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + 0.4);
}
addEventListener('visibilitychange', () => { if (document.hidden) audio?.suspend?.(); else audio?.resume?.(); });

// === SHARING ===
const room = orb?.room?.join((e) => {
  if (e.type === 'joined') gardeners = 1 + (e.peers?.length || 0);
  else if (e.type === 'join') gardeners++;
  else if (e.type === 'leave') gardeners = Math.max(1, gardeners - 1);
  else if (e.type === 'message' && e.data?.plant) { if (addPlant(e.data.plant, { fresh: true })) makeWay(); }
  else if (e.type === 'message' && e.data?.water) { startRain(); waterCount++; showWater(); }
  updateCount();
});
let seeded = false;
async function refresh() {
  try {
    const list = await store.get(KEY);
    if (Array.isArray(list)) for (const item of list) addPlant(item);
    const real = plants.filter((p) => !p.orbSeed).length;
    let extra = plants.filter((p) => p.orbSeed).length - Math.max(0, STARTERS - real);
    for (let i = 0; i < plants.length && extra > 0; i++) if (plants[i].orbSeed) { known.delete(plants[i].id); plants.splice(i--, 1); extra--; }
    const w = Number(await store.get(WATER)); if (Number.isFinite(w) && w > waterCount) waterCount = w;
  } catch {}
  if (!seeded) { seeded = true; seedStarters(Math.max(0, STARTERS - plants.length)); }
  updateCount(); showWater();
}
renderPicker();
await refresh();
setInterval(refresh, 60000);
setTimeout(() => orb?.capture?.(), 3500);

// === LOOP ===
const timer = new THREE.Timer();
renderer.setAnimationLoop((t) => {
  timer.update(t);
  const dt = Math.min(Math.max(timer.getDelta(), 0), 0.05), time = performance.now() / 1000;
  if (!controls.autoRotate && performance.now() - idleSince > 12000) controls.autoRotate = true;
  controls.update();
  grassUniforms.time.value = time;
  bounce = Math.max(0, bounce - dt * 0.5);
  layoutPlants(time);
  moveCritters(time, dt);
  clouds.children.forEach((c, i) => { c.position.x += dt * (0.6 + i * 0.1); if (c.position.x > 110) c.position.x = -110; });
  bath.children[2].position.y = 1.53 + Math.sin(time * 2) * 0.004;
  // Rain
  raining = Math.max(0, raining - dt);
  rain.material.opacity = Math.min(0.85, raining);
  rainCloud.visible = raining > 0;
  if (raining > 0) {
    rainCloud.position.set(Math.sin(time * 0.3) * 3, 10, Math.cos(time * 0.3) * 3);
    const a = rain.geometry.attributes.position.array;
    for (let i = 1; i < a.length; i += 3) { a[i] -= dt * 12; if (a[i] < 0) a[i] += 9.5; }
    rain.geometry.attributes.position.needsUpdate = true;
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
